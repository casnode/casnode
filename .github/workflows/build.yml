name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: web
      - run: yarn lint
        working-directory: web
      - run: yarn build
        working-directory: web

  release:
    runs-on: ubuntu-latest
    if: github.repository == 'casnode/casnode' && github.event_name == 'push'
    needs: [backend, frontend]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx -p semantic-release@24 semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
