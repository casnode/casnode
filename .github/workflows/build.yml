name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: web
      - run: yarn lint
        working-directory: web
      - run: yarn build
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: web-build
          path: web/build
          include-hidden-files: true
          retention-days: 1

  # Releases are cut by hand: push a `vX.Y.Z` tag and this job publishes it with the archives of every platform.
  github-release:
    runs-on: ubuntu-latest
    if: github.repository == 'casnode/casnode' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - run: bash .github/scripts/package.sh "$GITHUB_REF_NAME"
      - name: Publish release
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
