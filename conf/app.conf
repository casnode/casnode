; a server's own settings and secrets go in conf/app.local.conf (same format, not in git), which overrides this file
appname = casnode
; the Go backend; the Next.js server that renders the pages listens on httpport + 1
httpport = 16900
runmode = prod
copyrequestbody = true
; database: sqlite (dbName is the file), mysql, postgres or mssql. The database and tables are created when missing.
;   mysql:    dataSourceName = root:123456@tcp(localhost:3306)/
;   postgres: dataSourceName = user=postgres password=123456 host=localhost port=5432 sslmode=disable
;   mssql:    dataSourceName = sqlserver://sa:123456@localhost:1433
driverName = sqlite
dataSourceName =
dbName = casnode.db
; Casdoor sign-in. Write clientSecret only in conf/app.local.conf or pass it as an environment variable, and do not commit it
casdoorEndpoint =
clientId =
clientSecret =
casdoorOrganization =
casdoorApplication =
; who administers the forum besides Casdoor's own admins: user names, comma-separated
admins = admin
; sign in without Casdoor (any user name), only from this computer (127.0.0.1); for local development only, never on a server
devSignin = false
; where uploaded images and files are kept
uploadsDir = files/uploads
; behind CasWAF / Nginx, take the client IP from X-Forwarded-For
trustProxyHeader = false
